name: Build & Test

on:
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27' # The Go version to download (if necessary) and use.

      - name: 🔨 Build
        run: go build .

      - name: 🧪 Test
        run: go test .